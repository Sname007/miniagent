                updateReasoningButtons();

                console.error('加载配置失败:', err);
            }
            overlay.classList.add('visible');
        }

        function setReasoningEffort(effort) {
            currentReasoningEffort = effort;
            updateReasoningButtons();
        }

        function normalizeReasoningEffort(effort) {
            const alias = { minimal: 'low', medium: 'high', xhigh: 'high', ultra: 'max' };
            const value = alias[effort] || effort;
            return REASONING_EFFORTS.indexOf(value) >= 0 ? value : 'high';
        }

        function updateReasoningButtons() {
            REASONING_EFFORTS.forEach(function(effort) {
                const btn = document.getElementById('btn-reasoning-' + effort);
                if (btn) btn.classList.toggle('active', currentReasoningEffort === effort);
            });
        }

        let testRunning = false;

        function setTestResult(state, text) {
            const el = document.getElementById('test-result');
            const txt = document.getElementById('test-result-text');
            if (!el || !txt) return;
            el.className = 'test-result' + (state ? ' ' + state : '');
            txt.textContent = text || '';
        }

        async function testApiConnection() {
            if (testRunning) return;
            const baseUrl = document.getElementById('cfg-base-url').value.trim();
            const apiKey = document.getElementById('cfg-api-key').value.trim();
            const modelId = document.getElementById('cfg-model-id').value.trim();
            if (!baseUrl || !modelId) {
                setTestResult('err', '请先填写 Base URL 和 Model ID');
                return;
            }

            const btn = document.getElementById('btn-test-api');
            testRunning = true;
            btn.disabled = true;
            setTestResult('pending', '测试中...');

            try {
                const res = await fetch('/api/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ base_url: baseUrl, api_key: apiKey, model_id: modelId }),
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    setTestResult('ok', data.latency_ms + ' ms');
                } else {
                    setTestResult('err', data.message || '连接失败');
                }
            } catch (err) {
                setTestResult('err', '请求失败');
            } finally {
                testRunning = false;
                btn.disabled = false;
            }
        }

        function closeSettings() {
            const overlay = document.getElementById('settings-overlay');
            overlay.classList.remove('visible');
        }

        async function saveSettings() {
            const baseUrl = document.getElementById('cfg-base-url').value.trim();
            const apiKey = document.getElementById('cfg-api-key').value.trim();
            const modelId = document.getElementById('cfg-model-id').value.trim();
            const rawMaxTokens = document.getElementById('cfg-max-tokens').value.trim();

            if (!/^[1-9]\d*$/.test(rawMaxTokens)) {
                alert('Max Tokens 必须是非 0 开头的正整数');
                return;
            }
            const maxTokens = parseInt(rawMaxTokens, 10);

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base_url: baseUrl,
                        api_key: apiKey,
                        model_id: modelId,
                        reasoning_effort: currentReasoningEffort,
                        max_tokens: maxTokens,
                    }),
                });
                const data = await res.json().catch(function() { return {}; });
                if (!res.ok || data.status === 'error') {
                    alert(data.message || '保存配置失败');
                    return;
                }
                closeSettings();
                updateContextRing();
            } catch (err) {
                console.error('保存配置失败:', err);
                alert('保存配置失败');
            }
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            if (!toast || !toastMsg) return;
            toastMsg.textContent = msg;
            toast.classList.remove('toast-hidden');
            toast.classList.add('toast-visible');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('toast-visible');
                toast.classList.add('toast-hidden');
                toastTimer = null;
            }, 2000);
        }

        function dismissToast() {
            const toast = document.getElementById('toast');
            if (!toast) return;
            if (toast.classList.contains('toast-visible')) {
                toast.classList.remove('toast-visible');
                toast.classList.add('toast-hidden');
            }
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
        }

        async function fetchContextInfo() {
            if (!currentSessionId) return null;
            try {
                const res = await fetch(`/api/context/${currentSessionId}`);
                return await res.json();
            } catch (err) {
                console.error('获取上下文信息失败:', err);
                return null;
            }
        }

        function percentageToColor(pct) {
            if (pct <= 60) return '#34d399';
            if (pct < 80) return '#f59e0b';
            return '#ef4444';
        }

        function formatPercent(pct) {
            const value = Number(pct) || 0;
            return (value >= 10 ? String(Math.min(Math.round(value), 999)) : value.toFixed(1)) + '%';
        }

        function formatTokens(value) {
            return (Number(value) || 0).toLocaleString();
        }

        const CONTEXT_RING_CIRCUMFERENCE = 125.66;

        async function updateContextRing() {
            const info = await fetchContextInfo();
            renderContextRing(info ? Number(info.percentage) || 0 : null);
        }

        function renderContextRing(pct) {
            const ring = document.getElementById('context-ring');
            const percentEl = document.getElementById('context-percent');
            if (!ring || !percentEl) return;

            if (pct === null || Number.isNaN(pct)) {
                ring.style.strokeDashoffset = CONTEXT_RING_CIRCUMFERENCE;
                ring.style.stroke = '#34d399';
                percentEl.textContent = '0%';
                return;
            }

            const arcPct = Math.min(pct, 100);
            const offset = CONTEXT_RING_CIRCUMFERENCE * (1 - arcPct / 100);
            const color = percentageToColor(pct);

            ring.style.strokeDashoffset = offset;
            ring.style.stroke = color;

            percentEl.textContent = formatPercent(pct);
        }

        function applyContextUsage(usage) {
            if (!usage) return;
            let pct = Number(usage.percentage);
            if (!Number.isFinite(pct)) {
                const maxTokens = Number(usage.max_tokens) || 0;
                const contextTokens = Number(usage.context_tokens);
                const fallbackTokens = Number.isFinite(contextTokens)
                    ? contextTokens
                    : (Number(usage.input_tokens) || 0) + (Number(usage.output_tokens) || 0);
                pct = maxTokens > 0 ? (fallbackTokens / maxTokens) * 100 : 0;
            }
            renderContextRing(pct);
        }

        function closeContextInfo() {
            document.getElementById('ctxinfo-overlay').classList.remove('visible');
        }

        function addContextRow(label, value, isNote) {
            const row = document.createElement('div');
            row.className = 'ctxinfo-row' + (isNote ? ' note' : '');
            const labelEl = document.createElement('span');
            labelEl.className = 'ctxinfo-label';
            labelEl.textContent = label;
            const valueEl = document.createElement('span');
            valueEl.className = 'ctxinfo-value';
            valueEl.textContent = value;
            row.appendChild(labelEl);
            row.appendChild(valueEl);
            return row;
        }

        function renderContextInfo(info) {
            const isServer = info.source === 'server';
            const pct = Number(info.percentage) || 0;
            const maxTokens = Number(info.max_tokens) || 0;
            const contextTokens = Number(info.token_count) || 0;

            const sourceEl = document.getElementById('ctxinfo-source');
            sourceEl.textContent = isServer ? '服务端真实用量' : '本地估算';
            sourceEl.classList.toggle('server', isServer);

            const percentEl = document.getElementById('ctxinfo-percent');
            percentEl.textContent = formatPercent(pct);
            percentEl.style.color = percentageToColor(pct);

            document.getElementById('ctxinfo-token-count').textContent =
                formatTokens(contextTokens) + ' / ' + formatTokens(maxTokens) + ' token';

            const bar = document.getElementById('ctxinfo-bar-fill');
            bar.style.width = Math.min(pct, 100) + '%';
            bar.style.background = percentageToColor(pct);

            const rows = document.getElementById('ctxinfo-rows');
            rows.textContent = '';

            if (isServer) {
                const cached = Number(info.cached_tokens) || 0;
                const reasoning = Number(info.reasoning_tokens) || 0;
                rows.appendChild(addContextRow('本轮输入 token',
                    formatTokens(info.input_tokens) + (cached > 0 ? '（缓存命中 ' + formatTokens(cached) + '）' : '')));
                rows.appendChild(addContextRow('本轮输出 token',
                    formatTokens(info.output_tokens) + (reasoning > 0 ? '（思考 ' + formatTokens(reasoning) + '）' : '')));
                rows.appendChild(addContextRow('缓存命中率', (Number(info.cache_hit_rate) || 0).toFixed(1) + '%'));
                rows.appendChild(addContextRow('剩余可用',
                    formatTokens(Math.max(0, maxTokens - contextTokens)) + ' token'));
                if (info.model) {
                    rows.appendChild(addContextRow('统计模型', info.model));
                }
                if (info.updated_at) {
                    rows.appendChild(addContextRow('统计时间',
                        new Date(Number(info.updated_at) * 1000).toLocaleTimeString()));
                }
                rows.appendChild(addContextRow('占用口径',
                    '本轮输入 + 输出，即下一轮重发的历史规模', true));
            } else {
                rows.appendChild(addContextRow('本地分词估算', formatTokens(contextTokens) + ' token'));
                if (info.model) {
                    rows.appendChild(addContextRow('当前模型', info.model));
                }
                rows.appendChild(addContextRow('说明',
                    '服务端尚未返回 usage（新会话或服务端不支持），暂用本地分词估算，不含 system prompt 与工具定义', true));
            }
        }

        async function handleContextRingClick() {
            if (!currentSessionId) {
                showToast('请先创建或选择一个会话');
                return;
            }

            const indicator = document.getElementById('context-indicator');
            if (indicator) {
                indicator.style.background = 'rgba(255,255,255,0.08)';
                setTimeout(function() { indicator.style.background = ''; }, 200);
            }

            const ctxInfo = await fetchContextInfo();
            if (!ctxInfo) {
                showToast('获取上下文信息失败');
                return;
            }

            renderContextInfo(ctxInfo);
            document.getElementById('ctxinfo-overlay').classList.add('visible');
        }

        function setupOverlayListeners() {
            const co = document.getElementById('ctxinfo-overlay');
            if (co) {
                co.addEventListener('click', function(e) {
                    if (e.target === co) closeContextInfo();
                });
            }
            const so = document.getElementById('settings-overlay');
            if (so) {
                so.addEventListener('click', function(e) {
                    if (e.target === so) closeSettings();
                });
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupOverlayListeners);
        } else {
            setupOverlayListeners();
        }
    </script>

    <div id="toast" class="toast-hidden">
        <span id="toast-msg"></span>
    </div>

    <div id="ctxinfo-overlay">
        <div id="ctxinfo-dialog">
            <div class="ctxinfo-head">
                <span class="ctxinfo-title">上下文用量</span>
                <span id="ctxinfo-source" class="ctxinfo-source">—</span>
            </div>
            <div class="ctxinfo-hero">
                <span id="ctxinfo-percent">0%</span>
                <span id="ctxinfo-token-count"></span>
            </div>
            <div class="ctxinfo-bar"><i id="ctxinfo-bar-fill"></i></div>
            <div id="ctxinfo-rows" class="ctxinfo-rows"></div>
            <div id="ctxinfo-actions">
                <button class="btn-cancel" onclick="closeContextInfo()">关闭</button>
            </div>
        </div>
    </div>

    <div id="settings-overlay">
        <div id="settings-dialog">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                设置
            </h2>
            <div class="settings-field">
                <label for="cfg-base-url">Base URL</label>
                <input id="cfg-base-url" type="text" placeholder="https://api.deepseek.com">
            </div>
            <div class="settings-field">
                <label for="cfg-api-key">API Key</label>
                <input id="cfg-api-key" type="password" placeholder="sk-...">
            </div>
            <div class="settings-row">
                <div class="settings-field">
                    <label for="cfg-model-id">Model ID</label>
                    <input id="cfg-model-id" type="text" placeholder="deepseek-flash">
                </div>
                <div class="settings-field">
                    <label for="cfg-max-tokens" title="上下文窗口大小，仅用于界面显示用量百分比，不发送给 API">Max Tokens</label>
                    <input id="cfg-max-tokens" type="text" inputmode="numeric" autocomplete="off" placeholder="1000000">
                </div>
            </div>
            <div class="settings-field">
                <label>思考强度</label>
                <div class="reasoning-toggle">
                    <button id="btn-reasoning-none" onclick="setReasoningEffort('none')">
                        None
                    </button>
                    <button id="btn-reasoning-low" onclick="setReasoningEffort('low')">
                        Low
                    </button>
                    <button id="btn-reasoning-high" onclick="setReasoningEffort('high')">
                        High
                    </button>
                    <button id="btn-reasoning-max" onclick="setReasoningEffort('max')">
                        Max
                    </button>
                </div>
            </div>
            <div class="settings-actions">
                <button id="btn-test-api" class="btn-test" onclick="testApiConnection()">测试</button>
                <span id="test-result" class="test-result">
                    <svg class="ico-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <svg class="ico-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    <span id="test-result-text"></span>
                </span>
                <button class="btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn-save" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>
</body>
</html>
